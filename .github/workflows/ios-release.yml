# Builds, signs (cloud signing, no Mac anywhere), and uploads Secret Garden to
# TestFlight whenever an ios-v* tag is pushed (Ship-iOS.ps1 does that in one click).
#
# Required repo secrets (Settings -> Secrets and variables -> Actions), see
# ios/APPLE-SETUP.md for how to obtain each:
#   APP_STORE_CONNECT_API_KEY     - RAW contents of the AuthKey_*.p8 (not base64)
#   APP_STORE_CONNECT_API_KEY_ID  - the API key's Key ID
#   APP_STORE_CONNECT_ISSUER_ID   - the team's Issuer ID
#   APPLE_TEAM_ID                 - 10-character Apple Team ID
#
# There is deliberately NO separate Linux swift-test job: this repo has no Swift
# package to test — the shell is a single app target, so the archive step below
# IS the compile check.
name: iOS Release

on:
  push:
    tags: ["ios-v*"]

# contents: write lets the rolling ios-latest prerelease be updated
# (mirrors the Android workflow's 'latest' APK release).
permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: macos-15
    env:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fail in 2 seconds with a clear message if a secret is missing, instead of
      # ~10 minutes into the archive with a cryptic Apple error. (The p8 itself is
      # PEM-checked in the Write step below.)
      - name: Check required secrets are present
        run: |
          missing=0
          for v in APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_ISSUER_ID APPLE_TEAM_ID; do
            eval "val=\$$v"
            if [ -z "$val" ]; then echo "::error::$v secret is empty — see ios/APPLE-SETUP.md"; missing=1; fi
          done
          [ "$missing" = 0 ] || exit 1

      # Apple enforces a minimum SDK for TestFlight uploads; the runner image
      # ships several Xcodes and the default is not always the newest.
      # bash-3.2-safe: no associative arrays, plain sort -V.
      - name: Select newest Xcode
        run: |
          set -e
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$latest" ]; then echo "No Xcode found"; exit 1; fi
          echo "Selecting $latest"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version
          echo "iOS SDKs:"; xcodebuild -showsdks | grep -i iphoneos || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      # Written RAW — the secret must be the plain .p8 text, not base64
      # (base64 -> invalidPEMDocument deep inside the archive step).
      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          printf '%s\n' "$APP_STORE_CONNECT_API_KEY" > "$RUNNER_TEMP/asc.p8"
          grep -q -- '-----BEGIN PRIVATE KEY-----' "$RUNNER_TEMP/asc.p8" || {
            echo "::error::APP_STORE_CONNECT_API_KEY is not raw PEM (base64-pasted?) — paste the raw .p8, see ios/APPLE-SETUP.md"; exit 1; }

      # CURRENT_PROJECT_VERSION = run number: unique, monotonic build numbers,
      # which TestFlight requires. Marketing version stays 1.0.0 in project.yml.
      - name: Archive
        run: |
          xcodebuild archive \
            -project ios/SecretGarden.xcodeproj \
            -scheme SecretGarden \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/SecretGarden.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION=$(( ${{ github.run_number }} * 1000 + ${{ github.run_attempt }} ))

      - name: Export ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SecretGarden.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      # fastlane is preinstalled on GitHub macOS runner images, so no
      # Gemfile/bundler dance. Glob the ipa rather than hardcoding its name.
      - name: Upload to TestFlight
        env:
          ASC_KEY_FILEPATH: ${{ runner.temp }}/asc.p8
        run: |
          set -e
          command -v fastlane >/dev/null 2>&1 || gem install fastlane --no-document
          IPA_PATH=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          echo "Uploading $IPA_PATH"
          IPA_PATH="$IPA_PATH" fastlane upload_testflight

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc.p8"

      # Mirror the Android pipeline: keep the built binary as an artifact and on a
      # rolling prerelease (parallel to the APK's 'latest') for the record. The ipa
      # itself is App Store-signed — installs go through TestFlight, not sideload.
      - name: Rename ipa
        run: cp "$RUNNER_TEMP"/export/*.ipa secret-garden.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: secret-garden-ipa
          path: secret-garden.ipa
          retention-days: 90

      - name: Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ios-latest
          name: Secret Garden iOS latest
          prerelease: true
          files: secret-garden.ipa
          body: "Latest TestFlight build. Install via the TestFlight app (see ios/APPLE-SETUP.md); this ipa is attached for the record and cannot be sideloaded."
