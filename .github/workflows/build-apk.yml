name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: [README.md]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: false

      - name: Bootstrap wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.7

      - name: Signing keystore
        shell: bash
        working-directory: android
        env:
          PASSPHRASE: ${{ secrets.KEYSTORE_PASSPHRASE }}
        run: |
          if [ -n "$PASSPHRASE" ]; then
            if [ -f keystore.jks.enc ]; then
              openssl enc -aes-256-cbc -pbkdf2 -d -in keystore.jks.enc -out keystore.jks -pass pass:$PASSPHRASE
            else
              keytool -genkeypair -v -keystore keystore.jks -alias secretgarden -keyalg RSA -keysize 2048 -validity 10000 -storepass $PASSPHRASE -keypass $PASSPHRASE -dname "CN=Secret Garden, OU=App, O=shaver3josiah, C=US"
              openssl enc -aes-256-cbc -pbkdf2 -salt -in keystore.jks -out keystore.jks.enc -pass pass:$PASSPHRASE
              git config user.name github-actions
              git config user.email actions@github.com
              git add keystore.jks.enc
              git commit -m "add encrypted signing keystore"
              git push origin HEAD:main
            fi
            echo "SIGNING_STORE_FILE=$PWD/keystore.jks" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=$PASSPHRASE" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=secretgarden" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=$PASSPHRASE" >> "$GITHUB_ENV"
          else
            echo "KEYSTORE_PASSPHRASE secret not set, build will be debug-signed"
          fi

      - name: Build
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename
        run: cp android/app/build/outputs/apk/release/*.apk secret-garden.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: secret-garden-apk
          path: secret-garden.apk
          retention-days: 90

      - name: Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest
          name: Secret Garden latest
          prerelease: true
          files: secret-garden.apk
          body: "Download secret-garden.apk from the assets below and install it on your Android device."
