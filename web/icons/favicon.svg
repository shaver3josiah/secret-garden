<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Secret Garden badge (mark + honey rim): the little sloop on the river, one garden sprig, in a leaf-green disc. -->
  <defs>
    <clipPath id="sg-disc"><circle cx="128" cy="128" r="120"/></clipPath>
  </defs>
  <circle cx="128" cy="128" r="121.5" fill="#5B8C5A" stroke="#B4894D" stroke-width="3"/>
  <g clip-path="url(#sg-disc)">
    <path d="M0 176 Q32 168 64 176 T128 176 T192 176 T256 176 V256 H0 Z" fill="#4E7286"/>
    <path d="M150 214 Q170 208 190 214 T230 214" fill="none" stroke="#F4F7F0" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
  </g>
  <!-- sprig rising from the bank, topped with a single daisy -->
  <path d="M50 182 C44 160 38 132 42 104" fill="none" stroke="#2F5233" stroke-width="4" stroke-linecap="round"/>
  <g fill="#2F5233">
    <path d="M0 0 C8 -7 8 -19 0 -30 C-8 -19 -8 -7 0 0 Z" transform="translate(47,170) rotate(-38)"/>
    <path d="M0 0 C8 -7 8 -19 0 -30 C-8 -19 -8 -7 0 0 Z" transform="translate(43,150) rotate(28)"/>
    <path d="M0 0 C8 -7 8 -19 0 -30 C-8 -19 -8 -7 0 0 Z" transform="translate(40,131) rotate(-42)"/>
    <path d="M0 0 C8 -7 8 -19 0 -30 C-8 -19 -8 -7 0 0 Z" transform="translate(41,112) rotate(22)"/>
  </g>
  <g transform="translate(42,96)">
    <g fill="#F4F7F0">
      <ellipse cx="0" cy="-9" rx="5" ry="9"/>
      <ellipse cx="0" cy="-9" rx="5" ry="9" transform="rotate(60)"/>
      <ellipse cx="0" cy="-9" rx="5" ry="9" transform="rotate(120)"/>
      <ellipse cx="0" cy="-9" rx="5" ry="9" transform="rotate(180)"/>
      <ellipse cx="0" cy="-9" rx="5" ry="9" transform="rotate(240)"/>
      <ellipse cx="0" cy="-9" rx="5" ry="9" transform="rotate(300)"/>
    </g>
    <circle r="6" fill="#D8B26A"/>
  </g>
  <!-- sloop: hull + two paper sails; the gap between the sails stands in for the mast -->
  <path d="M70 162 H186 Q176 189 128 191 Q82 189 70 162 Z" fill="#B4894D"/>
  <path d="M134 46 V154 H190 Q174 96 134 46 Z" fill="#F4F7F0"/>
  <path d="M123 68 V154 H80 Q102 106 123 68 Z" fill="#F4F7F0"/>
</svg>
